<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEO Drive — Ավտոդպրոց Երևանում</title>
<meta name="description" content="NEO Drive — ժամանակակից ավտոդպրոց Երևանում՝ փորձառու հրահանգիչներով և ժամանակակից ավտոմեքենաներով։">
<style>
:root{--red:#f20a24;--red2:#ff3b1c;--gold:#ffc21a;--ink:#14181f;--dark:#10141a;--muted:#737984;--line:#e8eaee}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;font:16px/1.55 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{width:min(1200px,92%);margin:auto}
em{font-style:normal;color:var(--red)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:9px;padding:14px 24px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(110deg,#e90019,var(--red2) 65%,#ff9a00);box-shadow:0 6px 22px #ff28032e;transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#0b0f1599;border:1px solid #ffffffa8;box-shadow:none;backdrop-filter:blur(4px)}
.btn.sm{padding:10px 18px;font-size:14px}

/* hero */
.hero{position:relative;color:#fff;background:#0c1016 url(assets/hero.webp) 92% center/cover no-repeat;min-height:640px;padding-bottom:70px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#090c11f2 0%,#090c11b8 38%,#090c1100 72%),linear-gradient(0deg,#0c1016 0%,#0c101600 22%)}
.hero>.wrap{position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0}
.brand{display:inline-block;line-height:0}.brand img{height:128px;margin:-14px 0;width:auto;display:block}
.tools{display:flex;align-items:center;gap:14px}
.search{width:38px;height:38px;border-radius:9px;border:0;background:#ffffff2e;color:#fff;font-size:18px;display:grid;place-items:center}
.langs{display:flex;gap:4px}
.lang{border:0;background:none;color:#e4e4e8;font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 8px;border-bottom:2px solid transparent}
.lang.on{color:var(--gold);border-color:var(--gold)}
.hero-copy{max-width:600px;padding-top:34px}
h1{font-size:clamp(38px,5.2vw,66px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 20px;font-weight:800}
.lead{font-size:17px;line-height:1.5;color:#f1f1f3;max-width:450px;margin:0}
.lead b{font-size:19px;display:block;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 34px}
.perks{display:flex;flex-wrap:wrap;gap:26px;font-size:13px;line-height:1.3}
.perk{display:flex;align-items:center;gap:10px}
.perk .i{font-size:30px;color:var(--gold)}

.nav{display:flex;gap:30px;font-size:15px;font-weight:600}
.nav a{padding:6px 0;border-bottom:2px solid transparent;color:#fff}
.nav a:hover{color:var(--gold);border-color:var(--gold)}
/* sections */
.programs{position:relative;background:#fff;border-radius:26px 26px 0 0;margin-top:-30px;padding:34px 0 40px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
h2{font-size:clamp(25px,3vw,32px);line-height:1.2;margin:0;letter-spacing:-.5px;font-weight:800}
.more{font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:20px;background:linear-gradient(150deg,#fff 55%,#f3f4f7);display:flex;flex-direction:column;min-height:262px;box-shadow:0 4px 14px #1112180a;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px #11121818}
.card-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.ico{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#ff3b1c,#e5001f);color:#fff;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.card h3{margin:0;font-size:17px;line-height:1.2}
.card h3 small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.card ul{list-style:none;margin:0 0 20px;padding:0;font-size:13px;color:#4a4f58;position:relative;z-index:1}
.card li{display:flex;gap:8px;margin-bottom:4px}
.card li:before{content:"✓";color:var(--red);font-weight:900}
.card-bot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.price{color:var(--red);font-weight:800;font-size:23px}.price small{font-size:13px;color:var(--ink);font-weight:600;margin-right:5px}
.go{width:38px;height:38px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:18px;display:grid;place-items:center}
.card:after{content:"";position:absolute;right:-18px;bottom:6px;width:120px;height:88px;border-radius:50%;background:radial-gradient(#e9ebef,#f3f4f700 70%)}

.dark{background-color:#11151b;background-image:linear-gradient(90deg,#11151b 55%,#1a1f28);color:#fff;padding:30px 0}
.dark h2 em{color:var(--gold)}
.adv{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}
.adv div{display:flex;gap:12px}
.adv .ic{width:48px;height:48px;border-radius:50%;background:#ffc21a1c;color:var(--gold);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.adv h3{margin:0 0 4px;font-size:15px;line-height:1.2}.adv p{margin:0;font-size:12.5px;color:#b9bec7;line-height:1.4}

.mid{padding:34px 0 20px;background:#fff}
.mid-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:34px;align-items:start}
.inst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.person{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;box-shadow:0 3px 12px #1112180a}
.ph{width:64px;height:92px;border-radius:8px;flex-shrink:0;background:#f1f2f5;border:1px dashed #c9cdd5;color:#b4b9c3;display:grid;place-items:center;font-size:26px}
.person h3{margin:0;font-size:15px}.person p{margin:2px 0 8px;font-size:12px;color:var(--muted);line-height:1.3}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tags span{font-size:10px;font-weight:700;background:#f1f2f5;border-radius:5px;padding:2px 6px}
.note{font-size:11.5px;color:#9aa0aa;margin:10px 0 0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;counter-reset:s}
.step{text-align:center;font-size:13px;line-height:1.3;position:relative;padding:0 6px}
.step .ring{width:62px;height:62px;border-radius:50%;background:#f1f2f5;display:grid;place-items:center;margin:0 auto 10px;font-size:28px;position:relative}
.step .ring:before{counter-increment:s;content:counter(s);position:absolute;left:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.step:not(:last-child):after{content:"→";position:absolute;right:-9px;top:18px;color:#b9bdc6;font-size:18px}
h2.sp{margin-top:34px}

/* chat */
.chat{border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 34px #11121817;background:#fff;padding:16px}
.chat-head{display:flex;align-items:center;gap:10px}
.bot{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff3b1c,#e5001f);color:#fff;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.chat-head b{color:var(--red);font-size:15px}.chat-head small{display:block;color:var(--muted);font-size:12px}
.bubble{background:#f1f2f5;border-radius:11px;padding:12px;margin:14px 0 12px;font-size:14px;line-height:1.45}
.log{display:grid;gap:8px;max-height:230px;overflow:auto}
.log .me{justify-self:end;background:var(--red);color:#fff;border-radius:11px;padding:8px 12px;font-size:14px;max-width:85%}
.log .bot-msg{background:#f1f2f5;border-radius:11px;padding:10px 12px;font-size:14px;max-width:92%}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.quick button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;font-size:13px;text-align:left}
.quick button .i{color:var(--red);font-size:16px}
.quick button:hover{border-color:var(--red)}
.chat form{display:flex;gap:6px;border:1px solid var(--line);border-radius:30px;padding:4px 4px 4px 14px}
.chat input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:14px}
.chat form button{width:40px;height:40px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:18px;display:grid;place-items:center}

/* theory */
.theory{padding:10px 0 34px;background:#fff}
.thp{max-width:720px;color:#4a4f58;font-size:15px;margin:8px 0 16px}
.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.groups a{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;background:#fff;transition:.15s}
.groups a:hover{border-color:var(--red);color:var(--red)}
.groups a .i{color:var(--red)}
@media(max-width:1020px){.groups{grid-template-columns:repeat(2,1fr)}}
/* autodrom */
.auto{background-color:#0f1319;background-image:linear-gradient(90deg,#0f1319f2 20%,#0f131988 60%,#0f131955),url(assets/autodrom.jpg);background-position:center;background-size:cover;color:#fff;padding:34px 0;border-radius:22px 22px 0 0;margin-top:20px}
.auto-grid{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.auto h2 em{color:var(--gold)}.auto p{max-width:420px;color:#dfe2e7;font-size:15px;margin:8px 0 18px}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;background:#0b0e1380;border:1px solid #ffffff22;backdrop-filter:blur(5px);border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;line-height:1.25;max-width:170px}
.chip .i{font-size:28px;color:var(--gold)}

footer{background:#0c1015;color:#fff;padding:28px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.soc{display:flex;gap:18px;font-size:26px}
.soc a{opacity:.92}.soc a:hover{color:var(--gold)}
.contacts{font-size:14px;display:grid;gap:8px}.contacts div{display:flex;gap:10px;align-items:center}.contacts .i{color:var(--red);font-size:18px}
.contacts a:hover{color:var(--gold)}

/* modal */
dialog{border:0;border-radius:16px;padding:0;width:min(440px,92vw);box-shadow:0 20px 70px #0006}
dialog::backdrop{background:#0009}
.m{padding:26px}.m h2{font-size:24px}.m p{color:var(--muted);font-size:14px;margin:8px 0 16px}
.m label{display:block;font-size:12px;font-weight:700;margin-bottom:12px}
.m input,.m select{width:100%;margin-top:5px;padding:12px;border:1px solid #d9dce2;border-radius:8px;background:#fff}
.m .row{display:flex;gap:10px;margin-top:6px}.m .row .btn{flex:1}
.m .btn.plain{background:#eceef2;color:var(--ink);box-shadow:none}
.ok{color:#1f7a3e;font-size:14px;margin-top:12px}

/* responsive */
@media(max-width:1020px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .adv{grid-template-columns:repeat(2,1fr)}
 .mid-grid{grid-template-columns:1fr}
 .hero{background-position:70% center}
}
@media(max-width:1020px){header{flex-wrap:wrap}.nav{order:3;width:100%;gap:22px;justify-content:flex-start;font-size:14px}}
@media(max-width:640px){
 .hero{min-height:700px;background:#0c1016 url(assets/hero.webp) 78% bottom/auto 360px no-repeat}
 .hero:before{background:linear-gradient(180deg,#090c11f2 0%,#090c11d9 52%,#0c101600 78%)}
 .brand img{height:92px;margin:-10px 0}
 .search{display:none}.tools .btn{display:none}
 .hero-copy{padding-top:12px}.lead b{font-size:17px}
 .perks{gap:14px}.perk .i{font-size:24px}
 .cards,.adv,.inst{grid-template-columns:1fr}
 .steps{grid-template-columns:1fr 1fr;row-gap:22px}.step:after{display:none}
 
 .chip{max-width:none;flex:1 1 100%}
 .sec-head{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

</svg>

<section class="hero" id="top">
 <div class="wrap">
  <header>
   <a href="#" class="brand" aria-label="NEO Drive"><img src="assets/logo.png" alt="NEO Drive — Driving School"></a>
   <nav class="nav" id="nav" aria-label="Main"></nav>
   <div class="tools">
    <button class="search" aria-label="Search" data-open-chat><svg class="i"><use href="#search"/></svg></button>
    <div class="langs" role="group" aria-label="Language">
     <button class="lang" data-lang="hy">ARM</button><button class="lang" data-lang="ru">RU</button><button class="lang" data-lang="en">ENG</button>
    </div>
    <button class="btn sm" data-book><svg class="i"><use href="#cal"/></svg><span data-t="signup"></span></button>
   </div>
  </header>

  <div class="hero-copy">
   <h1 data-t="h1"></h1>
   <p class="lead"><b data-t="leadTitle"></b><span data-t="lead"></span></p>
   <div class="actions">
    <button class="btn" data-book><svg class="i"><use href="#cal"/></svg><span data-t="enroll"></span><svg class="i"><use href="#arrow"/></svg></button>
    <a class="btn ghost" href="#programs" data-t="choose"></a>
   </div>
   <div class="perks" id="perks"></div>
  </div>
 </div>
</section>

<section class="programs" id="programs">
 <div class="wrap">
  <div class="sec-head"><h2 data-t="progTitle"></h2><a class="more" href="#programs"><span data-t="all"></span><svg class="i"><use href="#arrow"/></svg></a></div>
  <div class="cards" id="cards"></div>
 </div>
</section>

<section class="dark" id="advantages">
 <div class="wrap">
  <h2 data-t="advTitle"></h2>
  <div class="adv" id="adv"></div>
 </div>
</section>

<section class="mid" id="instructors">
 <div class="wrap mid-grid">
  <div>
   <div class="sec-head"><h2 data-t="instTitle"></h2></div>
   <div class="inst" id="inst"></div>
   <p class="note" data-t="instNote"></p>

   <h2 class="sp" data-t="howTitle"></h2>
   <div class="steps" id="steps"></div>
  </div>

  <aside class="chat" aria-label="Assistant" id="chat">
   <div class="chat-head">
    <span class="bot"><svg class="i"><use href="#robot"/></svg></span>
    <div><b data-t="botName"></b><small data-t="botSub"></small></div>
   </div>
   <div class="bubble" data-t="botHello"></div>
   <div class="log" id="log" aria-live="polite"></div>
   <div class="quick" id="quick"></div>
   <form id="chatForm" autocomplete="off">
    <input id="chatInput" type="text" data-ph="botPh" aria-label="Message">
    <button aria-label="Send"><svg class="i"><use href="#send"/></svg></button>
   </form>
  </aside>
 </div>
</section>

<section class="theory" id="theory">
 <div class="wrap">
  <h2 data-t="thTitle"></h2>
  <p class="thp" data-t="thText"></p>
  <div class="groups" id="groups"></div>
  <p class="note"><span data-t="thSrc"></span> <a href="https://roadpolice.am/hy/viv-exam" target="_blank" rel="noopener">roadpolice.am</a></p>
 </div>
</section>

<section class="auto" id="autodrom">
 <div class="wrap auto-grid">
  <div>
   <h2 data-t="autoTitle"></h2>
   <p data-t="autoText"></p>
   <button class="btn sm" data-book><span data-t="more"></span><svg class="i"><use href="#arrow"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
 </div>
</section>

<footer id="contact">
 <div class="wrap">
  <a href="#" class="brand" aria-label="NEO Drive"><img src="assets/logo.png" alt="NEO Drive — Driving School"></a>
  <div class="soc">
   <a href="#" aria-label="Instagram"><svg class="i"><use href="#insta"/></svg></a>

 $("#nav").innerHTML=NAV[lang].map((n,i)=>`<a href="#${["top","advantages","contact"][i]}">${n}</a>`).join("");
 $("#perks").innerHTML=t.perks.map((p,i)=>`<div class="perk">${ico(["cap","car","shield"][i])}<span>${p}</span></div>`).join("");
 $("#cards").innerHTML=t.cards.map((c,i)=>`<article class="card"><div class="card-top"><span class="ico">${ico(["wheel","gear","gear","book"][i])}</span><h3>${c.n}${c.s?`<small>${c.s}</small>`:""}</h3></div><ul>${c.l.map(x=>`<li>${x}</li>`).join("")}</ul><div class="card-bot"><span class="price"><small>${t.from}</small>${c.p} ${t.cur}</span><button class="go" data-book="${i}" aria-label="${c.n}">${ico("arrow")}</button></div></article>`).join("");
 $("#adv").innerHTML=t.adv.map((a,i)=>`<div><span class="ic">${ico(["users","car","cal","shield"][i])}</span><span><h3>${a[0]}</h3><p>${a[1]}</p></span></div>`).join("");
 $("#inst").innerHTML=t.inst.map((p,i)=>`<div class="person"><span class="ph" aria-hidden="true">${ico("users")}</span><div><h3>${p[0]}</h3><p>${p[1]}</p><div class="tags">${p[2].map(l=>`<span>${l}</span>`).join("")}</div></div></div>`).join("");
 $("#steps").innerHTML=t.steps.map((s,i)=>`<div class="step"><div class="ring">${ico(["doc","head","cal","car","id"][i])}</div>${s}</div>`).join("");
 $("#quick").innerHTML=t.quick.map((q,i)=>`<button type="button" data-q="${i}">${ico(q[0])}${q[1]}</button>`).join("");
 $("#chips").innerHTML=t.chips.map(c=>`<div class="chip">${ico(c[0])}<span>${c[1]}</span></div>`).join("");
 $("#course").innerHTML=t.cards.map(c=>`<option>${c.n}</option>`).join("");
 $("#groups").innerHTML=Array.from({length:10},(_,i)=>`<a href="https://roadpolice.am/exam/abc/${lang}/${i+1}.pdf" target="_blank" rel="noopener">${t.thGroup} ${i+1}${ico("arrow")}</a>`).join("");
 $("#log").innerHTML="";
}

function say(text,me){const d=document.createElement("div");d.className=me?"me":"bot-msg";d.textContent=text;$("#log").append(d);d.scrollIntoView({block:"nearest"})}
document.addEventListener("click",e=>{
 const l=e.target.closest(".lang");
 if(l){lang=l.dataset.lang;try{localStorage.setItem("neo-lang",lang)}catch(_){}render();return}
 const q=e.target.closest("[data-q]");
 if(q){const i=+q.dataset.q,t=T[lang];say(t.quick[i][1],true);say(t.answers[i]);return}
 const b=e.target.closest("[data-book]");
 if(b){if(b.dataset.book!==""&&!isNaN(+b.dataset.book))$("#course").selectedIndex=+b.dataset.book;$("#ok").textContent="";$("#book").showModal();return}
 if(e.target.closest("[data-open-chat]")){$("#chat").scrollIntoView({behavior:"smooth"});$("#chatInput").focus({preventScroll:true})}
});
$("#cancel").onclick=()=>$("#book").close();
$("#book").addEventListener("click",e=>{if(e.target.id==="book")e.target.close()});

$("#chatForm").addEventListener("submit",e=>{
 e.preventDefault();
 const inp=$("#chatInput"),v=inp.value.trim();if(!v)return;
 const t=T[lang],low=v.toLowerCase();
 say(v,true);
 const i=t.kw.findIndex(ws=>ws.some(w=>low.includes(w)));
 say(i>=0?t.answers[i]:t.fallback);
 inp.value="";
});

$("#bookForm").addEventListener("submit",async e=>{
 const f=e.submitter&&e.submitter.value==="ok";
 if(!f)return;
 e.preventDefault();
 const form=e.currentTarget,data=Object.fromEntries(new FormData(form));
 const t=T[lang];
 if(!form.reportValidity())return;
 if(FORM_ENDPOINT){
  try{const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
   if(!r.ok)throw 0;$("#ok").textContent=t.sent;form.reset();return}catch(_){}
 }
 const blob=new Blob([`NEO Drive\n${data.name}\n${data.phone}\n${data.course}\n${new Date().toISOString()}\n`],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="neo-drive-request.txt";a.click();URL.revokeObjectURL(a.href);
 $("#ok").textContent=t.saved;form.reset();
});

render();
</script>
</body>
</html>
