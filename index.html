<style>
:root{--red:#f20a24;--red2:#ff3b1c;--gold:#ffc21a;--ink:#14181f;--dark:#10141a;--muted:#737984;--line:#e8eaee}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;font:16px/1.55 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{width:min(1200px,92%);margin:auto}
em{font-style:normal;color:var(--red)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:9px;padding:14px 24px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(110deg,#e90019,var(--red2) 65%,#ff9a00);box-shadow:0 6px 22px #ff28032e;transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#0b0f1599;border:1px solid #ffffffa8;box-shadow:none;backdrop-filter:blur(4px)}
.btn.sm{padding:10px 18px;font-size:14px}

/* hero */
.hero{position:relative;color:#fff;background:url(assets/hero3.webp?v=6) right bottom/auto 100% no-repeat,linear-gradient(180deg,#52434e 0%,#5c4c57 17%,#a96a58 28%,#8a5f5d 36%,#5b3d3a 46%,#402f2d 60%,#2e2523 75%,#1c1514 100%);min-height:clamp(620px,46vw,780px);padding-bottom:70px}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#1a110fa6 0%,#1a110f66 30%,#1a110f00 60%)}
.hero>.wrap{position:relative}.hero h1,.hero p,.hero .perks,.hero li{text-shadow:0 2px 16px #000b,0 0 4px #0008}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0}
.brand{display:inline-block;line-height:0}.brand img{height:150px;margin:0;width:auto;display:block;border-radius:0;box-shadow:0 8px 28px #0009,0 0 0 1px #ffffff1f}
.msgr{display:flex;gap:8px}.mi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 2px 8px #0005;transition:transform .15s}.mi:hover{transform:scale(1.1)}.mi svg{width:20px;height:20px}.mi.wa{background:#25D366}.mi.tg{background:#229ED9}
.tools{display:flex;align-items:center;gap:14px}
.search{width:38px;height:38px;border-radius:9px;border:0;background:#ffffff2e;color:#fff;font-size:18px;display:grid;place-items:center}
.langs{display:flex;gap:4px}
.lang{text-shadow:0 1px 4px #000c,0 0 8px #0008;border:0;background:none;color:#fff;font-size:17px;font-weight:800;letter-spacing:.5px;padding:6px 8px;border-bottom:2px solid transparent}
.lang.on{color:var(--gold);border-color:var(--gold)}
.hero-copy{max-width:600px;padding-top:34px}
h1{font-size:clamp(30px,3.9vw,50px);line-height:1.08;letter-spacing:-1px;margin:0 0 20px;font-weight:800}
.lead{font-size:17px;line-height:1.5;color:#fff;max-width:450px;margin:0}
.lead b{font-size:19px;display:block;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 34px}
.perks{display:flex;flex-wrap:wrap;gap:26px;font-size:13px;line-height:1.3}
.perk{display:flex;align-items:center;gap:10px}
.perk .i{font-size:30px;color:var(--gold)}

.nav{display:flex;gap:16px;font-size:16px;font-weight:800;align-items:center}
.nav a{position:relative;white-space:nowrap;padding:6px 0;font-weight:700;letter-spacing:.2px;color:#fff;text-shadow:0 1px 2px #0008;transition:color .2s,opacity .2s}
.nav a:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover{color:#ffd400}
.nav a:hover:after{background:#ffd400}
.dd{position:relative}
.dd{max-width:100%}.nav{flex-wrap:wrap;row-gap:4px}.ddb{font:inherit;text-align:left;font-size:15px;font-weight:700;letter-spacing:.2px;color:#fff;background:none;border:0;padding:6px 0;cursor:pointer;text-shadow:0 1px 2px #0008}
.ddb:hover,.dd.open .ddb{color:#ffd400}
.ddp{display:none;position:absolute;left:0;top:calc(100% + 8px);width:min(560px,92vw);max-height:70vh;overflow:auto;background:#fff;color:#111218;border-radius:14px;box-shadow:0 14px 44px #0006;padding:6px;z-index:60;font-size:15px;font-weight:500}
.dd.open .ddp{display:block}
.ddr{padding:10px 12px;border-bottom:1px solid #eceef2}.ddr:last-child{border:0}
.ddr b{display:block;font-size:14px;font-weight:700}.ddr span{display:block;color:#5d6472;font-size:13.5px;margin-top:2px}
.nav a.on{opacity:.88}
.nav a:hover:after,.nav a.on:after,body.tmode .nav a[href="#tests"]:after{transform:scaleX(1)}
/* sections */
.programs{position:relative;background:#0f1319;color:#fff;border-radius:26px 26px 0 0;margin-top:-30px;padding:34px 0 40px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
h2{font-size:clamp(25px,3vw,32px);line-height:1.2;margin:0;letter-spacing:-.5px;font-weight:800}
.more{font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:20px;background:linear-gradient(150deg,#fff 55%,#f3f4f7);display:flex;flex-direction:column;min-height:262px;box-shadow:0 4px 14px #1112180a;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px #11121818}
.card-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.ico{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#ff3b1c,#e5001f);color:#fff;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.card h3{margin:0;font-size:17px;line-height:1.2}
.card h3 small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.card ul{list-style:none;margin:0 0 20px;padding:0;font-size:13px;color:#4a4f58;position:relative;z-index:1}
.card li{display:flex;gap:8px;margin-bottom:4px}
.card li:before{content:"✓";color:var(--red);font-weight:900}
.card-bot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.price{color:var(--red);font-weight:800;font-size:23px}.price small{font-size:13px;color:var(--ink);font-weight:600;margin-right:5px}
.go{width:38px;height:38px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:18px;display:grid;place-items:center}
.card:after{content:"";position:absolute;right:-18px;bottom:6px;width:120px;height:88px;border-radius:50%;background:radial-gradient(#e9ebef,#f3f4f700 70%)}

.dark{background:#fff;color:#111;padding:30px 0 56px}
.dark h2 em{color:#111}
.programs h2{color:#fff}.programs .more{color:#fff}.programs .card{color:var(--ink)}
.adv .ic.ns{background:#e5251d1c}.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.adv div{display:flex;gap:12px}
.adv .ic{width:48px;height:48px;border-radius:50%;background:#e5251d14;color:var(--red);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.about{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}.about p{margin:0 0 8px;padding-left:26px;position:relative;font-size:17px;font-weight:600;color:var(--ink)}
.about p:before{content:"✓";position:absolute;left:0;top:0;color:var(--red);font-weight:800}
.adv h3{margin:0 0 4px;font-size:15px;line-height:1.2}.adv p{margin:0;font-size:12.5px;color:#5d6472;line-height:1.4}

.mid{padding:34px 0 20px;background:#fff}
.mid-grid{display:grid;grid-template-columns:1fr;gap:34px;align-items:start}
.inst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.person{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;box-shadow:0 3px 12px #1112180a}
.ph{width:64px;height:92px;border-radius:8px;flex-shrink:0;background:#f1f2f5;border:1px dashed #c9cdd5;color:#b4b9c3;display:grid;place-items:center;font-size:26px}
.person h3{margin:0;font-size:15px}.person p{margin:2px 0 8px;font-size:12px;color:var(--muted);line-height:1.3}
.person>div:last-child{align-self:center}.person p{margin:0;font-size:16px;font-weight:700;color:var(--ink,#111218)}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tags span{font-size:10px;font-weight:700;background:#f1f2f5;border-radius:5px;padding:2px 6px}
.note{font-size:11.5px;color:#9aa0aa;margin:10px 0 0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;counter-reset:s}
.step{text-align:center;font-size:13px;line-height:1.3;position:relative;padding:0 6px}
.step .ring{width:62px;height:62px;border-radius:50%;background:#f1f2f5;display:grid;place-items:center;margin:0 auto 10px;font-size:28px;position:relative}
.step .ring:before{counter-increment:s;content:counter(s);position:absolute;left:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.step:not(:last-child):after{content:"→";position:absolute;right:-9px;top:18px;color:#b9bdc6;font-size:18px}
h2.sp{margin-top:34px}

/* chat */
.chat{border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 34px #11121817;background:#fff;padding:16px}
.chat-head{display:flex;align-items:center;gap:10px}
.bot{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff3b1c,#e5001f);color:#fff;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.chat-head b{color:var(--red);font-size:15px}.chat-head small{display:block;color:var(--muted);font-size:12px}
.bubble{background:#f1f2f5;border-radius:11px;padding:12px;margin:14px 0 12px;font-size:14px;line-height:1.45}
.log{display:grid;gap:8px;max-height:230px;overflow:auto}
.log .me{justify-self:end;background:var(--red);color:#fff;border-radius:11px;padding:8px 12px;font-size:14px;max-width:85%}
.log .bot-msg{background:#f1f2f5;border-radius:11px;padding:10px 12px;font-size:14px;max-width:92%}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.quick button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;font-size:13px;text-align:left}
.quick button .i{color:var(--red);font-size:16px}
.quick button:hover{border-color:var(--red)}
.chat form{display:flex;gap:6px;border:1px solid var(--line);border-radius:30px;padding:4px 4px 4px 14px}
.chat input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:14px}
.chat form button{width:40px;height:40px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:18px;display:grid;place-items:center}

/* tests */
.tests[hidden]{display:none}
.tests{border-radius:26px 26px 0 0;margin-top:-30px;position:relative;padding-top:30px}
.tests+.programs{margin-top:0;border-radius:0}
body.tmode,body.tmode .hero,body.tmode .tests{background:#1f2126}
body.tmode .tests-head h2,body.tmode .ctsub,body.tmode .rvhead h3{color:#fff}
body.tmode .tinfo,body.tmode .tnote{color:#c9ccd3}
body.tmode .tests-head .tclose{background:#fff;color:#1f2126}
body.tmode .tcats button.on{background:var(--red);border-color:var(--red);color:#fff}
.hero header{width:100vw;margin-left:calc(50% - 50vw);padding-left:32px;padding-right:32px;box-sizing:border-box}
body.tmode .hero{min-height:0;padding-bottom:0;background-image:none}
body.tmode .hero:before{display:none}
body.tmode .hero-copy{display:none}
body.tmode section:not(.hero):not(.tests),body.tmode footer{display:none}
body.tmode .tests{margin-top:0;border-radius:0;min-height:80vh;padding-top:34px}
.tests-head h2{font-size:clamp(26px,3vw,38px);margin:0 0 8px;text-align:center;flex:1}
.tinfo{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;color:#555;font-size:15px;margin:6px 0 18px}
.tcats{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.tcats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px}
.tcats button.on{background:var(--red);border-color:var(--red);color:#fff}
.tests.cmode .tinfo{display:none}
.tests.running .tests-head h2,.tests.running .tinfo,.tests.running .tcats{display:none}
.ttimer{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.ttimer.low{color:var(--red)}
.tests-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cat{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;border-radius:999px;padding:5px 14px;margin-bottom:10px}
.tclose{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px}
.tests{padding:34px 0 10px;background:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tgrid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px}
.tgrid .tsc{display:inline;color:inherit;font-style:normal;font-weight:800;margin-left:6px}
.tgrid button b{display:inline-grid;place-items:center;min-width:40px;height:40px;border-radius:10px;background:#1b2a33;color:#fff}
.tgrid button small{display:block;font-weight:500;color:#667;font-size:13px}
.tgrid button:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.tgrid button:disabled{opacity:.5;cursor:default}
.tgrid button.done small{color:#1f7a3e;font-weight:700}.tgrid button.done b{background:#1f4d3b}
.tgrid button.fail small{color:#c4161c;font-weight:700}.tgrid button.fail b{background:#c4161c}
.tnote{background:#fff8e6;border:1px solid #ffe2a0;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.qcard{border:1px solid var(--line);border-radius:18px;padding:34px 38px;box-shadow:0 10px 40px #11121814;max-width:900px;margin:0 auto;background:#fff}
.tests.running{display:flex;flex-direction:column;justify-content:center}
.tests.running .tests-head{position:absolute;right:20px;top:20px}
@media(max-width:700px){.qcard{padding:20px 16px;border-radius:14px}.tests.running .tests-head{position:static;justify-content:flex-end}}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--muted);margin-bottom:10px}
.qbar{height:8px;background:#eef0f4;border-radius:6px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--red)}
.qtext{font-size:clamp(20px,2.4vw,27px);font-weight:700;line-height:1.4;margin:0 0 18px}
.qimg{width:100%;max-width:700px;height:auto;max-height:420px;object-fit:contain;border-radius:12px;margin:0 auto 20px;display:block}
.opts{display:grid;gap:12px}
.opts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:16px 18px;font-size:clamp(16px,1.7vw,19px);line-height:1.45}
.opts button:hover:not(:disabled){border-color:var(--red)}
.opts button.ok{background:#e9f7ee;border-color:#2f9e55}
.opts button.bad{background:#fdeaea;border-color:#d64545}
.qact button:disabled{opacity:.4;cursor:default}
.qact{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.res{font-size:28px;text-align:center;font-weight:800;margin:6px 0 12px}.res.pass{color:#1f7a3e}.res.fail{color:var(--red)}
/* theory */
.theory{padding:10px 0 34px;background:#fff}
.thp{max-width:720px;color:#4a4f58;font-size:15px;margin:8px 0 16px}
.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.groups a{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;background:#fff;transition:.15s}
.groups a:hover{border-color:var(--red);color:var(--red)}
.groups a .i{color:var(--red)}
@media(max-width:1020px){.groups{grid-template-columns:repeat(2,1fr)}}
/* autodrom */
.auto{background-color:#0f1319;background-image:linear-gradient(90deg,#0f1319f2 20%,#0f131988 60%,#0f131955),url(assets/autodrom.jpg);background-position:center;background-size:cover;color:#fff;padding:34px 0;border-radius:22px 22px 0 0;margin-top:20px}
.auto-grid{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.auto h2 em{color:var(--gold)}.auto p{max-width:420px;color:#dfe2e7;font-size:15px;margin:8px 0 18px}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;background:#0b0e1380;border:1px solid #ffffff22;backdrop-filter:blur(5px);border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;line-height:1.25;max-width:170px}
.chip .i{font-size:28px;color:var(--gold)}

footer{background:#0c1015;color:#fff;padding:28px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.soc{display:flex;gap:18px;font-size:26px}
.soc a{opacity:.92}.soc a:hover{color:var(--gold)}
.contacts{font-size:14px;display:grid;gap:8px}.contacts div{display:flex;gap:10px;align-items:center}.contacts .i{color:var(--red);font-size:18px}
.contacts a:hover{color:var(--gold)}

/* modal */
dialog{border:0;border-radius:16px;padding:0;width:min(500px,94vw);max-height:94vh;overflow:auto;box-shadow:0 20px 70px #0006}
dialog::backdrop{background:#0009}
.m{padding:26px}.m h2{font-size:24px}.m p{color:var(--muted);font-size:14px;margin:8px 0 16px}
.m label{display:block;font-size:12px;font-weight:700;margin-bottom:12px}
.m input,.m select{width:100%;margin-top:5px;padding:12px;border:1px solid #d9dce2;border-radius:8px;background:#fff}
.m .row{display:flex;gap:10px;margin-top:6px}.m .row .btn{flex:1}
.m .btn.plain{background:#eceef2;color:var(--ink);box-shadow:none}
.thanks{position:fixed;inset:0;display:none;place-items:center;background:#000a;z-index:50;padding:16px}.thanks.show{display:grid}
.tbox{background:#fff;border-radius:20px;padding:38px 30px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 60px #0007}
.tbox .tick{width:84px;height:84px;border-radius:50%;background:#e9f7ee;color:#1f9a4d;font-size:48px;font-weight:800;display:grid;place-items:center;margin:0 auto 14px}
.tbox p{color:var(--ink,#111218);font-size:26px;font-weight:800;margin:0 0 22px;line-height:1.3}
.tbox .tsub{font-size:16px;font-weight:600;color:#4a4f58;margin:-8px 0 18px}.tbox .btn{width:100%;margin-top:8px}.tbox .tg{background:#229ED9;box-shadow:none;text-decoration:none}.tbox .wa{background:#25D366;box-shadow:none;text-decoration:none}.tbox .btn.plain{background:#eceef2;color:var(--ink,#111218)}
.ipick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.ipick button{border:1px solid #d9dce2;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}.ipick button.sel{background:var(--red);border-color:var(--red);color:#fff}
.ipick.dur{align-items:center;gap:12px}.stp{width:40px;height:40px;border-radius:50%;border:1px solid #d9dce2;background:#fff;font-size:24px;font-weight:700;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}.stp:disabled{opacity:.35;cursor:default}.stp:not(:disabled):hover{border-color:var(--red);color:var(--red)}.dv{font-size:18px;min-width:64px;text-align:center}.amt{margin-left:auto;font-size:18px;font-weight:800;color:var(--red)}
.slots button.busy:disabled{background:#fde8ea;border-color:#e5001f;color:#c00018;opacity:1;text-decoration:line-through}.slots button:disabled:not(.busy){opacity:.4}
.slots .none{font-size:13px;color:var(--muted)}
.ct{padding:34px 0 40px;background:#f6f7f9}
.ctbox{margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;max-width:560px;box-shadow:0 8px 30px #11121812;text-align:center}
.ctbox canvas{width:100%;max-width:340px;height:auto;aspect-ratio:1;border-radius:50%;display:block;margin:6px auto 14px;background:#fff}
.ctq{font-weight:700;font-size:17px;margin:0 0 10px}.ctprog{font-size:13px;color:var(--muted);margin-bottom:6px}
.ctopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:340px;margin:0 auto}
.ctopts button{border:1px solid #d9dce2;background:#fff;border-radius:10px;padding:12px;font-size:20px;font-weight:800;cursor:pointer}.ctopts button:hover{border-color:var(--red);color:var(--red)}
.ctopts button.none{grid-column:1/-1;font-size:14px;font-weight:600;color:#4a4f58}
.ctres{font-size:18px;font-weight:800;margin:6px 0 8px}.opts button.sel{border-color:#2b4a9a;background:#eef2ff;font-weight:700}
.resh{display:flex;gap:18px;align-items:center;margin-bottom:18px}.resi{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800}.resi.pass{background:#1f7a3e}.resi.fail{background:#c4161c}
.ressc{font-size:22px;color:var(--muted)}.ressc b{font-size:38px;color:var(--ink)}.resn{font-size:13px;color:var(--muted)}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.rstats>div{background:#f3f4f8;border-radius:12px;padding:12px;text-align:center}.rstats small{display:block;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}.rstats b{font-size:26px}.rstats b.g{color:#1f7a3e}.rstats b.r{color:#c4161c}
.rvhead{max-width:900px;margin:30px auto 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.rvhead h3{margin:0;font-size:24px}
.rtabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}.rtabs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}.rtabs button.on{background:var(--red);color:#fff}
.rvlist{max-width:900px;margin:0 auto}.rv{background:#fff;border:1px solid var(--line);border-left:5px solid #c4161c;border-radius:14px;padding:20px 22px;margin-bottom:14px}.rv.g{border-left-color:#1f7a3e}
.rvh{font-size:13px;font-weight:700;color:#c4161c;margin-bottom:6px}.rv.g .rvh{color:#1f7a3e}
.ro{border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;background:#fff}.ro.ok{border-color:#1f7a3e;background:#e8f6ed}.ro.bad{border-color:#c4161c;background:#fdecec}.ro em{font-style:normal;font-weight:700;font-size:12px;margin-left:6px}

.ctbox .btn{margin-top:4px}
.ok{color:#1f7a3e;font-size:14px;margin-top:12px}

/* calendar */
.cal{border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:15px;text-transform:capitalize}
.cal-h button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.cal-h button:disabled{opacity:.35;cursor:default}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g span{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0;text-transform:uppercase}
.cal-g button{height:36px;border:0;border-radius:8px;background:#f4f5f8;font-size:13px;font-weight:600;color:var(--ink)}
.cal-g button:hover:not(:disabled){background:#ffe9a8}
.cal-g button.sel{background:var(--red);color:#fff}
.cal-g button.today{outline:2px solid var(--gold);outline-offset:-2px}
.cal-g button:disabled{background:none;color:#c3c7cf;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600}
.slots button.sel{background:var(--red);border-color:var(--red);color:#fff}
.pick{font-size:13px;margin-top:8px;color:var(--muted)}.pick.err{color:var(--red)}

en:{sub:"We will contact you soon.",paySub:"The time is reserved after payment. Message us on WhatsApp and we will send the payment details.",btn:"Message on WhatsApp for payment details",msg:b=>`Hello, I booked practical driving (${b.inst}) for ${b.date} ${b.time}, ${b.dur} h, ${b.price}. Please send the payment details.`}};
function thanks(msg,bk){const t=T[lang],w=WA[lang];$("#thanksSub").textContent=bk?w.paySub:w.sub;const a=$("#thanksWa");a.hidden=!bk;if(bk){a.textContent=w.btn;a.href="https://wa.me/"+WA_NUM+"?text="+encodeURIComponent(w.msg(bk))}$("#thanksMsg").textContent=msg;$("#thanksClose").textContent=t.cancel;$("#thanks").classList.add("show");$("#ok").textContent=""}
$("#thanksClose").onclick=()=>{$("#thanks").classList.remove("show");$("#bookDlg").close()};
$("#cancel").onclick=()=>$("#bookDlg").close();
$("#bookDlg").addEventListener("click",e=>{if(e.target.id==="bookDlg")e.target.close()});

$("#bookForm").addEventListener("submit",async e=>{
 const f=e.submitter&&e.submitter.value==="ok";
 if(!f)return;
 e.preventDefault();
 const form=e.currentTarget,data=Object.fromEntries(new FormData(form));data.date=selDate;data.time=selSlot;const prac=isPractical(),ci=curInst();if(prac&&ci){data.instructor=ci.name.hy+" ("+ci.id+")";data.duration_hours=selDur;data.end_time=mh(hm(selSlot)+selDur*60);data.price_amd=selDur*PRICE_H;data.status="AWAITING PAYMENT - after payment add to blocked: \""+selDate+" "+selSlot+(selDur>1?" "+selDur+"h":"")+"\""}const bk=prac&&ci?{inst:ci.name[lang]||ci.name.hy,date:selDate,time:selSlot,dur:selDur,price:money(selDur*PRICE_H)+" "+T[lang].cur}:null;
 const t=T[lang];
 if(!form.reportValidity())return;
 if(!selDate||!selSlot){const el=$("#pick");el.textContent=t.pickErr;el.classList.add("err");return}
 if(FORM_ENDPOINT){
  try{const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(WEB3FORMS_KEY?{access_key:WEB3FORMS_KEY,subject:(bk?"Summit Drive: NEW BOOKING (awaiting payment)":"Summit Drive: new sign-up request"),from_name:"Summit Drive website",...data}:data)});
   if(!r.ok)throw 0;if(WEB3FORMS_KEY){const j=await r.json().catch(()=>({}));if(j.success===false)throw 0}thanks(t.sent,bk);form.reset();onCourse();return}catch(_){}
 }
 const blob=new Blob([`Summit\n${data.name}\n${data.phone}\n${data.course}\n${data.date} ${data.time}\n${new Date().toISOString()}\n`],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="neo-drive-request.txt";a.click();URL.revokeObjectURL(a.href);
 thanks(t.saved,bk);form.reset();onCourse();
});

render();
if(location.hash==="#tests")openTests();
</script>
</body>
</html>
